<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikhil Kamble</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CARD */
.card {
  background: #111827;
  width: 500px;
  border-radius: 20px;
  text-align: center;
  padding-bottom: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  overflow: hidden;
}

/* HEADER */
.card-header {
  height: 140px;
  background: linear-gradient(135deg, #2563eb, #3b82f6);
}

/* IMAGE */
.profile-pic {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid #111827;
  margin-top: -60px;
  object-fit: cover;
}

/* NAME */
h2 {
  margin: 15px 0 5px;
  color: #f9fafb;
}

/* TYPING */
#typing {
  color: #60a5fa;
  font-weight: bold;
  min-height: 24px;
}

/* SKILLS */
.skills span {
  display: inline-block;
  background: #1f2937;
  color: #93c5fd;
  padding: 8px 14px;
  margin: 6px;
  border-radius: 20px;
}

/* ICONS */
.icons i {
  margin: 0 15px;
  color: #93c5fd;
  font-size: 22px;
  transition: 0.3s;
}

.icons i:hover {
  color: #3b82f6;
  transform: scale(1.2);
}

/* BUTTON */
.btn {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 20px;
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: white;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

/* ABOUT BOX (hidden by default) */
.about-box {
  display: none;
  background: #1f2937;
  margin: 15px auto;
  padding: 15px 20px;
  width: 80%;
  border-radius: 12px;
  color: #e5e7eb;
  font-size: 14px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="card">
  <div class="card-header"></div>

  <img src="nikhilkamble.jpg" class="profile-pic">

  <h2>Nikhil Kamble</h2>
  <p id="typing"></p>

  <div class="skills">
    <span>HTML</span>
    <span>CSS</span>
    <span>JavaScript</span>
    <span>Git</span>
  </div>

  <div class="icons">
    <a href="mailto:kamblenikhilsanjay@gmail.com"><i class="fa-solid fa-envelope"></i></a>
    <a href="https://github.com/" target="_blank"><i class="fa-brands fa-github"></i></a>
    <a href="https://www.linkedin.com/in/nikhil-kamble-934048272/" target="_blank">
      <i class="fa-brands fa-linkedin"></i>
    </a>
  </div>

  <!-- BUTTON -->
  <button class="btn" onclick="toggleAbout()">About Me</button>

  <!-- HIDDEN BOX -->
  <div id="about" class="about-box">
    I am an aspiring full-stack developer passionate about building modern and user-friendly web applications.
    I enjoy learning new technologies and improving my coding skills by working on real-world projects.
  </div>

</div>

<script>
// typing animation
const text = ["Aspiring Developer", "Web Designer", "Learning Full Stack"];
let i = 0, j = 0, current = "", isDeleting = false;

function type() {
  current = text[i];
  if (!isDeleting) {
    document.getElementById("typing").innerHTML = current.substring(0, j++);
    if (j > current.length) {
      isDeleting = true;
      setTimeout(type, 1000);
      return;
    }
  } else {
    document.getElementById("typing").innerHTML = current.substring(0, j--);
    if (j === 0) {
      isDeleting = false;
      i = (i + 1) % text.length;
    }
  }
  setTimeout(type, isDeleting ? 50 : 100);
}
type();

// toggle function
function toggleAbout() {
  const box = document.getElementById("about");
  box.style.display = (box.style.display === "block") ? "none" : "block";
}
</script>

</body>
</html>
