body {
  margin: 0;

/* CONTAINER */
.container {
  max-width: 1000px;

.card {

  padding-bottom: 30px;

.card:hover {

}

/* HEADER */

  height: 140px;
  background: linear-gradient(135deg, #111827, #1f2933);
}

/* IMAGE */
.profile-pic {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid #ffffff;
  margin-top: -60px;
  object-fit: cover;
}

/* NAME */
h2 {
  margin: 15px 0 5px;
  color: #111827;
}

/* TYPING */
#typing {
  color: #bfa046;
  font-weight: 500;
  min-height: 24px;
}

/* SKILLS */
.skills span {
  display: inline-block;
  background: #f3f4f6;

  padding: 8px 14px;
  margin: 6px;
  border-radius: 20px;
  font-size: 13px;
  transition: 0.3s;
  cursor: pointer;
}

.skills span:hover {
  background: #bfa046;
  color: white;
  transform: translateY(-3px);
}

/* ICONS */
.icons i {
  margin: 0 15px;
  color: #6b7280;
  font-size: 22px;
  transition: 0.3s;
}

.icons i:hover {
  color: #bfa046;
  transform: scale(1.2);
}

/* BUTTON */
.btn {
  margin-top: 15px;
  padding: 10px 20px;
  background: #111827;
  color: white;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}

.btn:hover {

/* PROJECTS */

.project-grid {

.project-card h3 {

.project-card p {

<script>
const text = ["Aspiring Developer", "Web Designer", "Learning Full Stack"];
let i = 0, j = 0, current = "", isDeleting = false;

function type() {
  current = text[i];
  if (!isDeleting) {
    document.getElementById("typing").innerHTML = current.substring(0, j++);
    if (j > current.length) {
      isDeleting = true;
      setTimeout(type, 1000);
      return;
    }
  } else {
    document.getElementById("typing").innerHTML = current.substring(0, j--);
    if (j === 0) {
      isDeleting = false;
      i = (i + 1) % text.length;
    }
  }
  setTimeout(type, isDeleting ? 50 : 100);
}
type();
</script>
